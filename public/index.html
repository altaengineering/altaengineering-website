<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bereich wählen — Alta Engineering AG</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== Design-Tokens 1:1 vom Kundenportal uebernommen ===== */
:root{
  color-scheme: light;
  --bg:#ffffff; --alt:#f5f7f9; --surface:#ffffff; --surface-2:#f0f3f6; --chip:#eaf1f8;
  --text:#1b2531; --muted:#586573; --line:#e4e8ed; --line-2:#d3d9e0;
  --accent:#215d92; --accent-dark:#184a78; --btn:#215d92; --btn-hover:#184a78; --accent-2:#96690f;
  --header-bg:rgba(255,255,255,.9); --shadow:rgba(20,30,45,.09); --shadow-strong:rgba(20,30,45,.16);
  --ok:#1c7a4a; --err:#b23a2f;
  --maxw:1180px; --gutter:clamp(18px,4.5vw,56px); --radius:10px;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1218; --alt:#121a23; --surface:#16202b; --surface-2:#1c2833; --chip:rgba(96,168,235,.14);
  --text:#e7edf3; --muted:#94a3b2; --line:#22303c; --line-2:#2f3f4d;
  --accent:#5aa6ec; --accent-dark:#82bef2; --btn:#2f74b8; --btn-hover:#3d86cd; --accent-2:#d3a24b;
  --header-bg:rgba(13,18,24,.82); --shadow:rgba(0,0,0,.5); --shadow-strong:rgba(0,0,0,.62);
  --ok:#4fce8f; --err:#ea6f63;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    color-scheme: dark;
    --bg:#0d1218; --alt:#121a23; --surface:#16202b; --surface-2:#1c2833; --chip:rgba(96,168,235,.14);
    --text:#e7edf3; --muted:#94a3b2; --line:#22303c; --line-2:#2f3f4d;
    --accent:#5aa6ec; --accent-dark:#82bef2; --btn:#2f74b8; --btn-hover:#3d86cd; --accent-2:#d3a24b;
    --header-bg:rgba(13,18,24,.82); --shadow:rgba(0,0,0,.5); --shadow-strong:rgba(0,0,0,.62);
    --ok:#4fce8f; --err:#ea6f63;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 42px 42px;
  background-position: -1px -1px;
  background-attachment: fixed;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}

/* ===== Hintergrund-Leiterbahnen, gleiches Motiv wie im Zeiterfassungstool (zft_check) =====
   Echtes SVG-Pattern statt CSS-Gradient-Trick, nur so lassen sich rechtwinklig geknickte
   Leiterbahnen zeichnen, nicht nur gerade Streifen (siehe Lektion dort). Grosse Kachel (400px),
   das Motiv selbst sitzt nur in der linken oberen Ecke, damit genug Abstand zwischen den
   Wiederholungen bleibt statt wie Tapete zu wirken. */
.app-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(1400px 760px at 42% -12%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 64%),
    radial-gradient(1000px 620px at 96% 92%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 68%),
    radial-gradient(900px 560px at 12% 108%, color-mix(in srgb, var(--accent-2) 26%, transparent), transparent 70%),
    linear-gradient(128deg, transparent 40%, color-mix(in srgb, var(--accent) 7%, transparent) 52%, transparent 64%);
  background-size:100% 100%,100% 100%,100% 100%,100% 100%;
  mask-image: radial-gradient(1900px 1500px at 50% 25%, black 0%, transparent 94%);
  -webkit-mask-image: radial-gradient(1900px 1500px at 50% 25%, black 0%, transparent 94%);
  animation: app-bg-atmen 14s ease-in-out infinite, app-bg-drift 26s ease-in-out infinite;
}
.app-bg-traces{position:absolute;inset:0;width:100%;height:100%}
.pcb-trace{fill:none;stroke:color-mix(in srgb, var(--accent) 15%, transparent);stroke-width:1.1;stroke-linecap:round}
.pcb-via{fill:color-mix(in srgb, var(--accent) 25%, transparent)}
.pcb-pad{fill:none;stroke:color-mix(in srgb, var(--accent-2) 22%, transparent);stroke-width:1.1}
@keyframes app-bg-atmen{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes app-bg-drift{0%,100%{background-position:0 0,0 0,0 0,0 0}50%{background-position:1.5% -1%,-1% 1.5%,1% -1.5%,0 0}}
@media (prefers-reduced-motion: reduce){.app-bg{animation:none}}

/* ===== Rundgang (Hilfe-Fragezeichen oben rechts) ===== */
.tour-overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);backdrop-filter:blur(2px);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.tour-overlay.open{display:flex}
.tour-modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 50px var(--shadow-strong);max-width:420px;width:100%;padding:1.6rem;position:relative}
.tour-modal .tour-icon{font-size:1.8rem;margin-bottom:.6rem}
.tour-modal h3{font-size:1.05rem;font-weight:700;margin-bottom:.5rem}
.tour-modal p{font-size:.9rem;color:var(--muted);margin-bottom:1.2rem}
.tour-dots{display:flex;gap:.35rem;margin-bottom:1.1rem}
.tour-dots span{width:7px;height:7px;border-radius:99px;background:var(--line-2);display:inline-block}
.tour-dots span.active{background:var(--accent);width:18px}
.tour-actions{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.tour-actions-right{display:flex;gap:.6rem;align-items:center}
.tour-skip{font-size:.8rem;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.tour-skip:hover{color:var(--accent)}
.tour-close{position:absolute;top:.9rem;right:.9rem;width:28px;height:28px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.tour-close:hover{color:var(--accent);border-color:var(--accent)}

header{position:sticky;top:0;z-index:40;background:var(--header-bg);backdrop-filter:blur(9px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:74px}
.brand{display:flex;align-items:center;gap:.7rem;line-height:1.05}
.brand img{height:34px;width:auto;display:block;border-radius:4px}
.brand-text{display:flex;flex-direction:column}
.brand b{font-weight:700;font-size:1.18rem;letter-spacing:.01em;color:var(--text)}
.brand span{font-size:.68rem;color:var(--accent);letter-spacing:.08em;margin-top:3px;font-family:var(--mono);text-transform:uppercase}
.nav-actions{display:flex;align-items:center;gap:.7rem}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;transition:.2s}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{width:19px;height:19px}
.theme-toggle .sun{display:none}
.theme-toggle .moon{display:block}
:root[data-theme="dark"] .theme-toggle .moon{display:none}
:root[data-theme="dark"] .theme-toggle .sun{display:block}
.back-link{display:inline-flex;align-items:center;gap:.35rem;font-size:.84rem;color:var(--muted);font-weight:600;padding:.5rem .85rem;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);transition:.2s}
.back-link:hover{color:var(--accent);border-color:var(--accent)}
.back-link svg{width:14px;height:14px}
.handbuch-link{color:var(--accent);border-color:var(--accent);background:var(--chip)}

.hero{background:var(--alt);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero .wrap{padding:clamp(34px,5vw,54px) var(--gutter)}
.kicker{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-family:var(--mono)}
.hero h1{font-weight:700;font-size:clamp(1.7rem,3.6vw,2.3rem);letter-spacing:-.02em;margin-top:.6rem}
.who{margin-top:.9rem;font-size:.92rem;color:var(--muted);display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--chip);color:var(--accent);border:1px solid var(--line-2);padding:.28rem .7rem;border-radius:99px;font-size:.76rem;font-weight:600;font-family:var(--mono);letter-spacing:.03em}
.badge.admin{background:rgba(90,166,236,.16)}
.email-mono{font-family:var(--mono);font-size:.86rem;color:var(--text)}

main .wrap{padding:clamp(28px,5vw,48px) var(--gutter) 80px}

.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.1rem;margin-top:.4rem}
.choice-card{
  display:flex;flex-direction:column;gap:.6rem;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.6rem 1.6rem 1.4rem;position:relative;box-shadow:0 10px 26px var(--shadow);
  transition:.2s; cursor:pointer;
}
.choice-card::before,.choice-card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--accent);opacity:.55}
.choice-card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.choice-card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.choice-card:hover{transform:translateY(-2px);box-shadow:0 16px 34px var(--shadow-strong);border-color:var(--accent)}
.choice-card .icon{font-size:1.8rem;line-height:1}
.choice-card h2{font-size:1.15rem;font-weight:700}
.choice-card p{font-size:.9rem;color:var(--muted)}
.choice-card .go{margin-top:.4rem;font-size:.84rem;font-weight:700;color:var(--accent);display:inline-flex;align-items:center;gap:.35rem}
.choice-card .go svg{width:15px;height:15px;transition:.2s}
.choice-card:hover .go svg{transform:translateX(3px)}

.loading{color:var(--muted);font-size:.92rem;padding:2rem 0}

.foot-note{font-size:.78rem;color:var(--muted);margin-top:1.8rem;text-align:center}

@media (max-width: 640px){
  .nav{gap:.5rem}
  .brand img{height:28px}
  .brand b{font-size:1rem}
  .brand span{font-size:.6rem}
  .nav-actions{gap:.4rem}
  .back-link{padding:.5rem .6rem}
  .back-link .lbl{display:none}
}
</style>
</head>
<body>

<div class="app-bg" aria-hidden="true">
  <svg class="app-bg-traces" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="pcb-pattern" width="400" height="400" patternUnits="userSpaceOnUse">
        <path class="pcb-trace" d="M0 40 H50 L60 50 V90 H130" />
        <path class="pcb-trace" d="M100 0 V30 L110 40 H160" />
        <path class="pcb-trace" d="M20 160 V120 L30 110 H90 L100 120 V160" />
        <path class="pcb-trace" d="M160 100 H140 L130 90 V60" />
        <path class="pcb-trace" d="M0 130 H30" />
        <circle class="pcb-via" cx="60" cy="50" r="2.2" />
        <circle class="pcb-via" cx="130" cy="90" r="2.2" />
        <circle class="pcb-via" cx="110" cy="40" r="2.2" />
        <circle class="pcb-via" cx="30" cy="110" r="2.2" />
        <circle class="pcb-via" cx="100" cy="120" r="2.2" />
        <circle class="pcb-pad" cx="0" cy="40" r="3" />
        <circle class="pcb-pad" cx="160" cy="100" r="3" />
        <circle class="pcb-pad" cx="30" cy="160" r="3" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#pcb-pattern)" />
  </svg>
</div>

<header>
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Alta Engineering AG">
      <img src="https://alta-engineering.ch/logo.png" alt="Alta Engineering AG">
      <div class="brand-text">
        <b>Alta Engineering AG</b>
        <span>Kundenportal</span>
      </div>
    </a>
    <div class="nav-actions">
      <a class="back-link handbuch-link" href="/portal" id="navPortalLink" style="display:none"><span>📁</span><span class="lbl">Kundenportal</span></a>
      <a class="back-link handbuch-link" href="/dms" id="navDmsLink" style="display:none"><span>🗂️</span><span class="lbl">Dokumentenlenkung</span></a>
      <a class="back-link handbuch-link" href="/qm-handbuch" id="navHandbuchLink" style="display:none"><span>📘</span><span class="lbl">QM-Handbuch</span></a>
      <a class="back-link" href="https://alta-engineering.ch" target="_blank" rel="noopener">
        <span class="lbl">Hauptwebsite</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
      </a>
      <button class="theme-toggle" id="tourBtn" aria-label="Rundgang starten" title="Rundgang: alles erklärt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
      <button class="theme-toggle" id="themeToggle" aria-label="Darstellung wechseln" title="Darstellung wechseln">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="tour-overlay" id="tourOverlay">
  <div class="tour-modal">
    <button class="tour-close" id="tourCloseBtn" aria-label="Schliessen">✕</button>
    <div class="tour-icon" id="tourIcon"></div>
    <h3 id="tourTitle"></h3>
    <p id="tourText"></p>
    <div class="tour-dots" id="tourDots"></div>
    <div class="tour-actions">
      <button class="iconbtn" id="tourBack">Zurück</button>
      <div class="tour-actions-right">
        <button class="tour-skip" id="tourSkipBtn">Überspringen</button>
        <button class="btn-lg primary" id="tourNext" style="padding:.55rem 1.1rem;font-size:.86rem">Weiter</button>
      </div>
    </div>
  </div>
</div>

<div class="hero">
  <div class="wrap">
    <div class="kicker">Sicherer Bereich</div>
    <h1>Wohin möchtest du?</h1>
    <div class="who" id="whoBox">Lade Nutzerinfo …</div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="loading" id="loadingState">Einen Moment …</div>
    <div class="choice-grid" id="choiceGrid" style="display:none"></div>
    <p class="foot-note">alta-engineering.ch · läuft geschützt über Cloudflare Access</p>
  </div>
</main>

<script>
(function(){
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');
  function currentTheme(){
    var set = root.getAttribute('data-theme');
    if (set) return set;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  if (toggle){
    toggle.addEventListener('click', function(){
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch(e){}
    });
  }
  try {
    var saved = localStorage.getItem('theme');
    if (saved) root.setAttribute('data-theme', saved);
  } catch(e){}
})();
</script>

<script>
(function(){
  function api(path){
    return fetch(path).then(function(r){
      if (!r.ok) return r.json().then(function(e){ throw new Error(e.error || ('Fehler ' + r.status)); });
      return r.json();
    });
  }

  var CARDS = {
    portal: {
      href: '/portal', icon: '📁', title: 'Kundenportal',
      desc: 'Dateien mit uns teilen: hochladen, herunterladen, Freigabe-Links für Projektabgaben erstellen.'
    },
    dms: {
      href: '/dms', icon: '🗂️', title: 'Dokumentenlenkung',
      desc: 'Internes QM-System: Dokumente, Versionen und Freigabestatus verwalten. Nur für Admins.'
    }
  };

  function renderCards(keys){
    var grid = document.getElementById('choiceGrid');
    grid.innerHTML = '';
    keys.forEach(function(key){
      var c = CARDS[key];
      var a = document.createElement('a');
      a.className = 'choice-card';
      a.href = c.href;
      a.innerHTML =
        '<span class="icon">' + c.icon + '</span>' +
        '<h2>' + c.title + '</h2>' +
        '<p>' + c.desc + '</p>' +
        '<span class="go">Öffnen <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
      grid.appendChild(a);
    });
    grid.style.display = '';
    document.getElementById('loadingState').style.display = 'none';
  }

  api('/api/me').then(function(me){
    var whoBox = document.getElementById('whoBox');
    var rollenText = me.isAdmin ? 'Admin, sieht alle Ordner' : (me.isMitarbeiter ? 'Mitarbeiter' : 'Kunde');
    whoBox.innerHTML =
      '<span class="email-mono">' + me.email + '</span>' +
      '<span class="badge' + (me.isAdmin ? ' admin' : '') + '">' + rollenText + '</span>';

    if (me.isAdmin){
      document.getElementById('navPortalLink').style.display = '';
      document.getElementById('navDmsLink').style.display = '';
      document.getElementById('navHandbuchLink').style.display = '';
      renderCards(['portal', 'dms']);
    } else {
      // Kunden und Mitarbeitende ohne Admin-Rechte haben ohnehin nur eine sinnvolle Anlaufstelle,
      // die Wahl macht fuer sie keinen Sinn (DMS ist komplett admin-only, siehe /api/dms/*),
      // deshalb direkt zum Kundenportal weiter statt eine leere Wahl mit einer Karte zu zeigen.
      location.replace('/portal');
    }
  }).catch(function(e){
    document.getElementById('whoBox').textContent = 'Fehler beim Laden: ' + e.message;
    document.getElementById('loadingState').textContent = 'Konnte Nutzerinfo nicht laden.';
  });
})();
</script>

<script>
(function(){
  var STEPS = [
    { icon: '👋', title: 'Willkommen im Kundenbereich', text: 'Hier wählst du, wo du hin möchtest. Kund:innen kommen automatisch direkt ins Kundenportal, Admins sehen zusätzlich die Dokumentenlenkung.' },
    { icon: '📁', title: 'Kundenportal', text: 'Dateien mit uns austauschen: hochladen, herunterladen, Freigabe-Links für Projektabgaben erstellen, ohne dass die Empfänger:innen selbst einen Zugang brauchen.' },
    { icon: '🗂️', title: 'Dokumentenlenkung (DMS)', text: 'Unser internes QM-System: Dokumente anlegen, Versionen hochladen, Status Entwurf/Geprüft/Freigegeben setzen. Nur für Admins sichtbar.' },
    { icon: '❓', title: 'Rundgang jederzeit erneut starten', text: 'Das Fragezeichen oben rechts öffnet diesen Rundgang auf jeder Seite erneut, falls du etwas nachschlagen willst.' }
  ];
  var idx = 0;
  var overlay = document.getElementById('tourOverlay');
  var iconEl = document.getElementById('tourIcon');
  var titleEl = document.getElementById('tourTitle');
  var textEl = document.getElementById('tourText');
  var dotsEl = document.getElementById('tourDots');
  var backBtn = document.getElementById('tourBack');
  var nextBtn = document.getElementById('tourNext');

  function render(){
    var s = STEPS[idx];
    iconEl.textContent = s.icon;
    titleEl.textContent = s.title;
    textEl.textContent = s.text;
    dotsEl.innerHTML = STEPS.map(function(_, i){ return '<span class="' + (i === idx ? 'active' : '') + '"></span>'; }).join('');
    backBtn.style.visibility = idx === 0 ? 'hidden' : 'visible';
    nextBtn.textContent = idx === STEPS.length - 1 ? 'Fertig' : 'Weiter';
  }
  function open(){ idx = 0; render(); overlay.classList.add('open'); }
  function close(){ overlay.classList.remove('open'); }

  document.getElementById('tourBtn').addEventListener('click', open);
  document.getElementById('tourCloseBtn').addEventListener('click', close);
  document.getElementById('tourSkipBtn').addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
  backBtn.addEventListener('click', function(){ if (idx > 0){ idx--; render(); } });
  nextBtn.addEventListener('click', function(){
    if (idx < STEPS.length - 1){ idx++; render(); } else { close(); }
  });
})();
</script>

</body>
</html>
