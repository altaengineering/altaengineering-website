<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumentenlenkung · Alta Engineering AG</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<link rel="stylesheet" href="/dms.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/dms" aria-label="Dokumentenlenkung">
      <img src="https://alta-engineering.ch/logo.png" alt="Alta Engineering AG">
      <div><b>Dokumentenlenkung</b><small id="brandTenant">Alta Engineering</small></div>
    </a>
    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
    <div class="top-right">
      <select class="top-select" id="tenantSwitcher" aria-label="Kunde wechseln" hidden></select>
      <a class="back" id="portalLink" href="/portal" title="Zum Kundenportal" hidden><span>📁</span><span class="lbl"> Kundenportal</span></a>
      <button class="icon-btn" id="helpBtn" aria-label="Rundgang starten" title="Rundgang: alles erklärt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" aria-label="Darstellung wechseln" title="Hell/Dunkel">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="me-pill" id="mePill" hidden><span class="av" id="meAv">?</span><span class="t" id="meName"></span></div>
    </div>
  </div>
</header>

<main class="page" id="page"><div class="empty">Lade …</div></main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="Dokument">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-actions" id="drawerActions"></div>
  <div class="drawer-tabs" id="drawerTabs"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<section class="preview-pane" id="preview" aria-label="Vorschau"></section>

<input type="file" id="versionFileInput" hidden>

<script src="/blueprint.js"></script>
<script src="/dms.js"></script>
</body>
</html>
